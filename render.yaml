# Render Blueprint for the AstraGraph API (free tier). See api/README.md.
services:
  - type: web
    name: astragraph-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ASTRAGRAPH_ALLOWED_ORIGINS
        sync: false   # set to your website URL(s) when creating the service
